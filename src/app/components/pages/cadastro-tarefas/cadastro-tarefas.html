<h4 class="text-primary">Cadastro de tarefas</h4>
<p>Preencha os dados da tarefa e clique em salvar.</p>

<form [formGroup]="formCadastro"(ngSubmit)="cadatrarTarefa()">

    <div class="mb-3">
        <label>Nome da tarefa:</label>
        <input type="text" class="form-control" formControlName="nome"/>
    </div>

    <div class="mb-3">
        <label>Data da tarefa:</label>
        <input type="date" class="form-control"formControlName="data"/>
    </div>

    <div class="mb-3">
        <label>Hora da tarefa:</label>
        <input type="time" class="form-control" formControlName="hora" />
    </div>

    <div class="mb-3">
        <label>Categoria da tarefa:</label>
        <select class="form-select" formControlName="categoria" >
            <option value="">Escolha uma opção</option>            
        </select>
    </div>

    <div class="mb-3">
        <label>Prioridade da tarefa:</label>
        <select class="form-select" formControlName="prioridade">
            <option value="">Escolha uma opção</option>            
        </select>
    </div>

    <div class="mb-3">
        <label>Finalizado:</label>
        <select class="form-select" formControlName="finalizado">
            <option value="">Escolha uma opção</option>            
        </select>
    </div>

    <div class="mb-3">
        <label>Comentários:</label>
        <textarea class="form-control" formControlName="comentarios" ></textarea>
    </div>

    <div class="mb-3">
        <input [disabled]="formCadastro.invalid" type="submit" class="btn btn-success" value="Realizar cadastro"/>
    </div>

    
</form>
